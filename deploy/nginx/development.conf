resolver 127.0.0.11 valid=10s ipv6=off;

upstream php_development {
    zone php_development 64k;
    server ${PEANUT_API_HOST}:${PEANUT_API_PORT};
}

upstream web_development {
    zone web_development 64k;
    server web:5173 resolve;
}

upstream platform_development {
    zone platform_development 64k;
    server platform:5177 resolve;
}

upstream pc_development {
    zone pc_development 64k;
    server pc:3100 resolve;
}

upstream mobile_development {
    zone mobile_development 64k;
    server mobile:5174 resolve;
}

server {
    listen 80;
    server_name _;
    # Keep the transport ceiling slightly above the largest application-level
    # upload limit (video: 200 MB); UploadService still enforces per-type caps.
    client_max_body_size 210m;

    location = /admin {
        return 302 /admin/;
    }

    location = /platform {
        return 302 /platform/;
    }

    # Application APIs bypass the frontend development servers.
    location ~ ^/(?:adminapi|api|platformapi|installapi)/ {
        proxy_pass http://php_development;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Runtime file URLs are generated from the browser-visible host. Serve
    # those paths from PHP instead of letting the frontend dev servers handle
    # them, so local uploads and brand assets work through the fixed gateway.
    location ^~ /brand/ {
        proxy_pass http://php_development;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /storage/ {
        return 404;
    }

    # The Vite container owns the /admin/ UI and HMR connection.
    location /admin/ {
        proxy_pass http://web_development;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /platform/ {
        proxy_pass http://platform_development;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /mobile/ {
        proxy_pass http://mobile_development;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        proxy_pass http://pc_development;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

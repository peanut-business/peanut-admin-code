name: peanut-admin-production

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-build-proxy: &build-proxy
  PEANUT_SOURCE_COMMIT: ${PEANUT_SOURCE_COMMIT:?set PEANUT_SOURCE_COMMIT to the exact source commit}
  PEANUT_SOURCE_TREE: ${PEANUT_SOURCE_TREE:?set PEANUT_SOURCE_TREE to the exact source tree}
  HTTP_PROXY: ${BUILD_HTTP_PROXY:-}
  HTTPS_PROXY: ${BUILD_HTTPS_PROXY:-}
  ALL_PROXY: ${BUILD_ALL_PROXY:-}
  NO_PROXY: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1}
  http_proxy: ${BUILD_HTTP_PROXY:-}
  https_proxy: ${BUILD_HTTPS_PROXY:-}
  all_proxy: ${BUILD_ALL_PROXY:-}
  no_proxy: ${BUILD_NO_PROXY:-localhost,127.0.0.1,::1}

x-build-hosts: &build-hosts
  - "host.docker.internal:host-gateway"

services:
  pc:
    image: ${PC_IMAGE:-peanut-admin-pc:production}
    build:
      context: ..
      dockerfile: deploy/docker/production.Dockerfile
      target: pc
      args: *build-proxy
      extra_hosts: *build-hosts
    restart: unless-stopped
    environment:
      NUXT_UPSTREAM_ORIGIN: http://nginx
      NUXT_FORWARDED_PROTO: ${PEANUT_PUBLIC_SCHEME:?set PEANUT_PUBLIC_SCHEME for the PC SSR origin}
      NUXT_TRUSTED_HOSTS: ${PEANUT_TRUSTED_HOSTS:?set PEANUT_TRUSTED_HOSTS for the PC SSR origin}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/pc/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  php:
    image: ${PHP_IMAGE:-peanut-admin-php:production}
    build:
      context: ..
      dockerfile: deploy/docker/production.Dockerfile
      target: php
      args:
        <<: *build-proxy
        PEANUT_DEPLOYMENT_RECEIPT_BASE64: ${PEANUT_DEPLOYMENT_RECEIPT_BASE64:-}
      extra_hosts: *build-hosts
    restart: unless-stopped
    command: ["/usr/local/bin/peanut-php-entrypoint"]
    environment:
      PEANUT_SERVER_ENV_FILE: /var/www/peanut-admin/server/.env.source
    depends_on:
      mysql:
        condition: service_healthy
        required: false
    volumes:
      - ${PEANUT_DEPLOYMENT_RECEIPT_FILE:?set PEANUT_DEPLOYMENT_RECEIPT_FILE for the deployment receipt}:/var/www/peanut-admin/DEPLOYMENT_RECEIPT.json:ro
      - ${PEANUT_SERVER_ENV_FILE:-../server/.env}:/var/www/peanut-admin/server/.env.source:ro
      - php-runtime:/var/www/peanut-admin/server/runtime
      - php-storage:/var/www/peanut-admin/server/public/storage
      - php-private-storage:/var/www/peanut-admin/server/private/storage
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/peanut-ready && php-fpm -t"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  nginx:
    image: ${NGINX_IMAGE:-peanut-admin-nginx:production}
    build:
      context: ..
      dockerfile: deploy/docker/production.Dockerfile
      target: nginx
      args: *build-proxy
      extra_hosts: *build-hosts
    restart: unless-stopped
    ports:
      - "127.0.0.1:${HTTP_PORT:-18092}:80"
    volumes:
      - ${PEANUT_DEPLOYMENT_RECEIPT_FILE:?set PEANUT_DEPLOYMENT_RECEIPT_FILE for the deployment receipt}:/var/www/peanut-admin/DEPLOYMENT_RECEIPT.json:ro
      - ${PEANUT_SERVER_ENV_FILE:-../server/.env}:/var/www/peanut-admin/server/.env.source:ro
      - php-storage:/var/www/peanut-admin/server/public/storage:ro
    depends_on:
      php:
        condition: service_healthy
      pc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 6
      start_period: 10s
    logging: *default-logging

  mysql:
    image: mysql:8.4
    profiles: [bundled-db]
    restart: unless-stopped
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_NAME:?set DB_NAME in server/.env}
      MYSQL_USER: ${DB_USER:?set DB_USER in server/.env}
      MYSQL_PASSWORD: ${DB_PASS:?set DB_PASS in server/.env}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS:-}
      TZ: Asia/Shanghai
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    logging: *default-logging

  # The scheduler is part of the backend runtime and is enabled by default.
  cron:
    image: ${PHP_IMAGE:-peanut-admin-php:production}
    pull_policy: never
    restart: unless-stopped
    working_dir: /var/www/peanut-admin/server
    command: ["/usr/local/bin/peanut-php-entrypoint", "cron"]
    environment:
      PEANUT_SERVER_ENV_FILE: /var/www/peanut-admin/server/.env.source
    volumes:
      - ${PEANUT_DEPLOYMENT_RECEIPT_FILE:?set PEANUT_DEPLOYMENT_RECEIPT_FILE for the deployment receipt}:/var/www/peanut-admin/DEPLOYMENT_RECEIPT.json:ro
      - ${PEANUT_SERVER_ENV_FILE:-../server/.env}:/var/www/peanut-admin/server/.env.source:ro
      - php-runtime:/var/www/peanut-admin/server/runtime
      - php-storage:/var/www/peanut-admin/server/public/storage
      - php-private-storage:/var/www/peanut-admin/server/private/storage
    depends_on:
      php:
        condition: service_healthy
    logging: *default-logging

  # Redis is intentionally opt-in and has no dependency edge from app services.
  redis:
    image: redis:7-alpine
    profiles: [redis]
    restart: unless-stopped
    logging: *default-logging

volumes:
  mysql-data:
  php-runtime:
  php-storage:
  php-private-storage:

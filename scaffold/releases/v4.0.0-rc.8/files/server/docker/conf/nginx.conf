user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;
    client_max_body_size 210m;
    server {
        listen 80;
        server_name _;
        root /var/www/peanut-admin/server/public;
        index index.html index.php;
        charset utf-8;
        # Traffic is allowed only by a persistent grant. It is revoked before
        # update state changes and restored after private terminal verification.
        if (!-f /var/www/peanut-admin/server/runtime/upgrade/.mount-ready) { return 503; }
        if (!-f /var/www/peanut-admin/server/runtime/upgrade/.traffic-ready) { return 503; }
        if (-e /var/www/peanut-admin/server/runtime/upgrade/maintenance.json) { return 503; }
        if (-e /var/www/peanut-admin/server/runtime/upgrade/current-update.json) { return 503; }
        location = /healthz { access_log off; add_header Content-Type text/plain; return 200 "ok\n"; }
        location = /install { return 302 /install/; }
        location /install/ { try_files $uri $uri/ /install/index.html; }
        location = / { try_files /pc/index.html =404; }
        location = /admin { return 302 /admin/; }
        location = /platform { return 302 /platform/; }
        location = /mobile { return 302 /mobile/; }
        location = /pc { return 302 /pc/; }
        location ~ ^/(?:adminapi|api|platformapi|installapi)/ { rewrite ^/(.*)$ /index.php?s=/$1 last; }
        location /admin/ { try_files $uri $uri/ /admin/index.html; }
        location /platform/ { try_files $uri $uri/ /platform/index.html; }
        location /mobile/ { try_files $uri $uri/ /mobile/index.html; }
        location /pc/ { try_files $uri $uri/ /pc/index.html; }
        location ^~ /_nuxt/ { try_files /pc$uri =404; }
        location ^~ /brand/ { try_files $uri /pc$uri =404; }
        location = /favicon.svg { try_files /admin/favicon.svg =404; }
        location ^~ /storage/ { return 404; }
        location ^~ /private/ { return 404; }
        location ^~ /runtime/ { return 404; }
        location ^~ /docker/ { return 404; }
        location ^~ /vendor/ { return 404; }
        location ~* \.(?:js|css|svg|png|jpe?g|webp|ico|woff2?|ttf|map)$ { try_files $uri /pc$uri =404; }
        location / { try_files $uri $uri/ /pc/index.html; }
        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/peanut-admin/server/public/index.php;
            fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
            fastcgi_param HTTP_X_FORWARDED_PROTO $scheme;
            fastcgi_param HTTP_PROXY "";
            fastcgi_pass php:9000;
        }
        location ~ /\. { deny all; }
        location ~ \.php$ { return 404; }
    }
}

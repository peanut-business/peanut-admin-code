server {
    listen 80;
    server_name _;

    root /var/www/peanut-admin/server/public;
    index index.html index.php;
    charset utf-8;
    # The application enforces type-specific limits up to 200 MB for video.
    client_max_body_size 210m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # SSR PC owns the canonical root URL.
    location = / {
        proxy_pass http://pc:3000;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /admin {
        return 302 /admin/;
    }

    location = /mobile {
        return 302 /mobile/;
    }

    location = /pc {
        return 302 /pc/;
    }

    location = /platform {
        return 302 /platform/;
    }

    # Preserve the Application prefix for ThinkPHP multi-app dispatch.
    location ~ ^/(?:adminapi|api|platformapi|installapi)/ {
        rewrite ^/(.*)$ /index.php?s=/$1 last;
    }

    # The admin SPA and its history fallback are isolated below /admin/.
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # Instance-wide PlatformOperator control plane is isolated from /admin/.
    location /platform/ {
        try_files $uri $uri/ /platform/index.html;
    }

    # UniApp H5 is a static SPA built below /mobile/.
    location /mobile/ {
        try_files $uri $uri/ /mobile/index.html;
    }

    location /pc/ {
        return 302 /;
    }

    location ^~ /brand/ {
        try_files $uri =404;
    }

    location / {
        proxy_pass http://pc:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /favicon.svg {
        try_files /admin/favicon.svg =404;
    }

    # Tenant files are delivered only after the application rechecks the
    # current Tenant state. Historical direct object paths fail closed.
    location ^~ /storage/ {
        return 404;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_param HTTP_X_FORWARDED_PROTO $http_x_forwarded_proto;
        fastcgi_param HTTP_PROXY "";
        fastcgi_pass php:9000;
    }

    location ~ /\. {
        deny all;
    }
}

name: Resource registry

on:
  pull_request:
    branches:
      - dev
      - main
    paths:
      - 'resources/project-resources.json'
      - 'scripts/project-resource-registry'
      - '.github/workflows/resource-registry.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resource-registry-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate resource registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate project resources
        run: ./scripts/project-resource-registry validate

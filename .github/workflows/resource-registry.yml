name: Resource registry

# Run only when a completed batch is explicitly selected for validation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate resource registry
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate project resources
        run: ./scripts/project-resource-registry validate

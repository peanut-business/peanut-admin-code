name: Repository policy

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
      - main
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protected-branches:
    name: Preserve integration branches
    runs-on: ubuntu-latest
    steps:
      - name: Verify integration branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for branch in dev main; do
            gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" --jq '.name' | grep -Fx "$branch" >/dev/null || {
              printf 'repository-policy: required branch is missing: %s\n' "$branch" >&2
              exit 1
            }
          done
          printf 'repository-policy: dev and main exist\n'

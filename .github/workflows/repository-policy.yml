name: Repository policy

# Synchronization is not a validation request. Select a completed batch explicitly.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-policy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  protected-branches:
    name: Preserve integration branches
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify integration branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          for branch in dev main; do
            gh api "repos/${GITHUB_REPOSITORY}/branches/${branch}" --jq '.name' | grep -Fx "$branch" >/dev/null || {
              printf 'repository-policy: required branch is missing: %s\n' "$branch" >&2
              exit 1
            }
          done
          printf 'repository-policy: dev and main exist\n'

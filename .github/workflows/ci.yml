name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stale-facts:
    name: Stale facts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject retired current guidance
        run: |
          ./scripts/check-environment-sources

  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.paths.outputs.server }}
      web: ${{ steps.paths.outputs.web }}
      platform: ${{ steps.paths.outputs.platform }}
      pc: ${{ steps.paths.outputs.pc }}
      uniapp: ${{ steps.paths.outputs.uniapp }}
      create_app: ${{ steps.paths.outputs.create_app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify affected products
        id: paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            for output in server web platform pc uniapp create_app; do
              echo "${output}=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")"
          matches() {
            grep -Eq "$1" <<< "$changed"
          }

          server_changed="$(grep -E '^server/' <<< "$changed" | grep -Ev '^(server/app/common/service/scaffold/.*|server/tests/Productization/CreateApplicationTest\.php)$' || true)"
          [[ -n "$server_changed" || "$(grep -E '^(scripts/ci-server-check\.sh|scripts/check-admin-api-permissions\.php)$' <<< "$changed" || true)" != "" ]] && echo 'server=true' >> "$GITHUB_OUTPUT" || echo 'server=false' >> "$GITHUB_OUTPUT"
          matches '^(web/|scripts/sync-brand-assets\.mjs$)' && echo 'web=true' >> "$GITHUB_OUTPUT" || echo 'web=false' >> "$GITHUB_OUTPUT"
          matches '^platform/' && echo 'platform=true' >> "$GITHUB_OUTPUT" || echo 'platform=false' >> "$GITHUB_OUTPUT"
          matches '^pc/' && echo 'pc=true' >> "$GITHUB_OUTPUT" || echo 'pc=false' >> "$GITHUB_OUTPUT"
          matches '^uniapp/' && echo 'uniapp=true' >> "$GITHUB_OUTPUT" || echo 'uniapp=false' >> "$GITHUB_OUTPUT"
          matches '^(scaffold/application-template-inventory\.json|scaffold/releases/v2\.0\.0/|scripts/create-app|scripts/build-application-template-inventory|scripts/build-scaffold-release|server/app/common/service/scaffold/ApplicationCreator\.php|server/tests/Productization/CreateApplicationTest\.php)$' && echo 'create_app=true' >> "$GITHUB_OUTPUT" || echo 'create_app=false' >> "$GITHUB_OUTPUT"

  create-app:
    name: Create app
    needs: changes
    if: needs.changes.outputs.create_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: Verify inventory and create-app contract
        run: |
          php scripts/build-application-template-inventory --check
          php server/tests/Productization/CreateApplicationTest.php

  php:
    name: PHP 8.3
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mt02_root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmt02_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2.10.2
          coverage: none

      - name: Create isolated backend environment
        shell: bash
        run: |
          backend_env="$GITHUB_WORKSPACE/server/.env.ci-${GITHUB_RUN_ID}"
          umask 077
          printf '%s\n' \
            'APP_ENV=development' \
            'APP_DEBUG=false' \
            'PEANUT_DEPLOYMENT_TARGET=local-development' \
            'DEPLOYMENT_MODE=standalone' \
            'DB_HOST=127.0.0.1' \
            'DB_PORT=3306' \
            'DB_NAME=peanut_admin_ci' \
            'DB_USER=root' \
            'DB_PASS=mt02_root' \
            'DB_ROOT_PASS=mt02_root' \
            'DB_PREFIX=pa_' > "$backend_env"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-8.3-composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-composer-

      - name: Validate Composer manifest
        working-directory: server
        run: composer validate --strict

      - name: Install Composer dependencies
        working-directory: server
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run focused server gates
        if: github.event_name == 'pull_request'
        env:
          CI_BASE_REF: ${{ github.event.pull_request.base.sha }}
          CI_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          CI_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: ./scripts/ci-server-check.sh --fast --env-file "$GITHUB_WORKSPACE/server/.env.ci-${GITHUB_RUN_ID}"

      - name: Run stage server gates
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/ci-server-check.sh --full --env-file "$GITHUB_WORKSPACE/server/.env.ci-${GITHUB_RUN_ID}"

      - name: Remove isolated backend environment
        if: always()
        shell: bash
        run: |
          backend_env="$GITHUB_WORKSPACE/server/.env.ci-${GITHUB_RUN_ID}"
          case "$backend_env" in
            "$GITHUB_WORKSPACE"/server/.env.ci-*) rm -f -- "$backend_env" ;;
            *) exit 1 ;;
          esac

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      - name: Check generated brand files
        run: node scripts/sync-brand-assets.mjs --check
      - name: Build
        working-directory: web
        run: pnpm run build
      - name: Test Web policies and form helpers
        working-directory: web
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path'
          import { createServer } from 'vite'

          const server = await createServer({
            root: process.cwd(),
            configFile: false,
            logLevel: 'error',
            resolve: { alias: { '@': path.resolve(process.cwd(), 'src') } },
            optimizeDeps: { disabled: true },
            server: { middlewareMode: true },
            appType: 'custom',
          })
          try {
            for (const test of [
              'permission-policy.test.ts',
              'plugin-contribution.test.ts',
              'department-parent-options.test.ts',
            ]) {
              await server.ssrLoadModule(`/tests/Productization/${test}`)
            }
          } finally {
            await server.close()
          }
          NODE
          node tests/Productization/navbar-avatar-fallback.test.mjs

  platform:
    name: Platform
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Install dependencies
        working-directory: platform
        run: npm ci
      - name: Typecheck
        working-directory: platform
        run: npm run type:check
      - name: Build
        working-directory: platform
        run: npm run build

  pc:
    name: PC
    needs: changes
    if: needs.changes.outputs.pc == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: pc/package-lock.json
      - name: Install dependencies
        working-directory: pc
        run: npm ci
      - name: Typecheck
        working-directory: pc
        run: npm run typecheck
      - name: Generate
        working-directory: pc
        run: npm run generate

  uniapp:
    name: UniApp
    needs: changes
    if: needs.changes.outputs.uniapp == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: uniapp/package-lock.json
      - name: Install dependencies
        working-directory: uniapp
        run: npm ci
      - name: Typecheck
        working-directory: uniapp
        run: npm run type-check
      - name: Build H5
        working-directory: uniapp
        run: npm run build:h5

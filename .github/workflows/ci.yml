name: CI

on:
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  stale-facts:
    name: Stale facts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Reject retired current guidance
        run: |
          ./scripts/check-environment-sources

  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    outputs:
      server: ${{ steps.paths.outputs.server }}
      web: ${{ steps.paths.outputs.web }}
      platform: ${{ steps.paths.outputs.platform }}
      pc: ${{ steps.paths.outputs.pc }}
      uniapp: ${{ steps.paths.outputs.uniapp }}
      create_app: ${{ steps.paths.outputs.create_app }}
      mysql: ${{ steps.paths.outputs.mysql }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Classify affected products
        id: paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            for output in server web platform pc uniapp create_app mysql; do
              echo "${output}=true" >> "$GITHUB_OUTPUT"
            done
            exit 0
          fi

          changed="$(git diff --name-only "${{ github.event.pull_request.base.sha }}...HEAD")"
          matches() {
            grep -Eq "$1" <<< "$changed"
          }

          # Shared package/tool changes affect their consumers, not only files under one client.
          shared='packages/|release-versions\.json$|scripts/(sync-brand-assets\.mjs|client-environment|local-client-dev)|\.github/workflows/ci\.yml$'
          matches '^(server/|plugins/|plugins\.lock$|resources/project-resources\.json$|scripts/(ci-server-check\.sh|run-php-test|check-admin-api-permissions\.php|check-test-integrity|tests/run-registered-mysql-tests|consumer-module-reference-chain|project-resource-registry|project-resource-lease)|\.github/workflows/ci\.yml$)' && echo 'server=true' >> "$GITHUB_OUTPUT" || echo 'server=false' >> "$GITHUB_OUTPUT"
          matches "^(web/|${shared})" && echo 'web=true' >> "$GITHUB_OUTPUT" || echo 'web=false' >> "$GITHUB_OUTPUT"
          matches "^(platform/|${shared})" && echo 'platform=true' >> "$GITHUB_OUTPUT" || echo 'platform=false' >> "$GITHUB_OUTPUT"
          matches "^(pc/|${shared})" && echo 'pc=true' >> "$GITHUB_OUTPUT" || echo 'pc=false' >> "$GITHUB_OUTPUT"
          matches "^(uniapp/|${shared})" && echo 'uniapp=true' >> "$GITHUB_OUTPUT" || echo 'uniapp=false' >> "$GITHUB_OUTPUT"
          matches '^(scaffold/|resources/project-resources\.json$|scripts/(create-app|build-application-template-inventory|build-scaffold-release|scaffold-runtime/|consumer-module-reference-chain|project-resource-registry|project-resource-lease)|server/app/common/(infrastructure|value|validation)/scaffold/|server/tests/Productization/(CreateApplication|ModuleBundleLifecycle|ModuleDeliveryOperation|ModulePackageArchive|ScaffoldUpgradeRunner)Test\.php$|\.github/workflows/ci\.yml$)' && echo 'create_app=true' >> "$GITHUB_OUTPUT" || echo 'create_app=false' >> "$GITHUB_OUTPUT"
          matches '^(resources/project-resources\.json$|scripts/(tests/run-registered-mysql-tests|project-resource-registry|project-resource-lease|consumer-module-reference-chain)|server/tests/Support/RegisteredMysqlTestResource\.php|server/tests/Modules/Official/Integration/IntegrationSecurityMysqlTest\.php|server/tests/Modules/Official/Notification/mysql-harness\.php|server/tests/Multitenancy/MemberSessionTenantIsolationTest\.php|server/app/modules/official/(identity|integration|member|notification|task)/|server/app/api/services/UserTokenService\.php|server/database/migrations/.*member[-_]session|\.github/workflows/ci\.yml$)' && echo 'mysql=true' >> "$GITHUB_OUTPUT" || echo 'mysql=false' >> "$GITHUB_OUTPUT"

  create-app:
    name: Create app
    needs: changes
    if: needs.changes.outputs.create_app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2.10.2
          coverage: none
      - name: Install the tool's locked dependencies
        working-directory: server
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts
      - name: Verify inventory and create-app contract
        run: |
          php scripts/build-application-template-inventory --check
          php server/tests/Productization/CreateApplicationTest.php

  php:
    name: PHP 8.3
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.10@sha256:c831a0f11348d402b43d77453e17d770be2eef356615a2823fe0f5a0d6c8b9af
        env:
          MYSQL_ROOT_PASSWORD: mt02_root
        ports:
          - 3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pmt02_root"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2.10.2
          coverage: none

      - name: Create isolated backend environment
        shell: bash
        run: |
          backend_env="$GITHUB_WORKSPACE/server/.env.ci-${GITHUB_RUN_ID}"
          registered_mysql_env="$GITHUB_WORKSPACE/server/.env.ci-mysql-${GITHUB_RUN_ID}"
          mysql_port='${{ job.services.mysql.ports[3306] }}'
          umask 077
          printf '%s\n' \
            'APP_ENV=development' \
            'APP_DEBUG=false' \
            'PEANUT_DEPLOYMENT_TARGET=local-development' \
            'DEPLOYMENT_MODE=multi-tenant' \
            'DB_HOST=127.0.0.1' \
            "DB_PORT=${mysql_port}" \
            'DB_NAME=peanut_admin_ci' \
            'DB_USER=root' \
            'DB_PASS=mt02_root' \
            'DB_ROOT_PASS=mt02_root' \
            'DB_PREFIX=pa_' > "$backend_env"
          sed 's/^DB_NAME=.*/DB_NAME=peanut_admin_ci_registered_mysql/' "$backend_env" > "$registered_mysql_env"
          printf '%s\n' \
            'PEANUT_DATABASE_RESOURCE_ID=peanut-admin-ci-real-mysql84' \
            'PEANUT_DATABASE_ENDPOINT_ID=peanut-admin-ci-real-mysql84-host' \
            'PEANUT_DATABASE_CONSUMER=host' >> "$registered_mysql_env"
          chmod 600 "$registered_mysql_env"

      - name: Cache Composer downloads
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-php-8.3-composer-${{ hashFiles('server/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-8.3-composer-

      - name: Validate Composer manifest
        working-directory: server
        run: composer validate --strict

      - name: Install Composer dependencies
        working-directory: server
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Run focused server gates
        if: github.event_name == 'pull_request'
        env:
          CI_BASE_REF: ${{ github.event.pull_request.base.sha }}
          CI_BASE_BRANCH: ${{ github.event.pull_request.base.ref }}
          CI_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: ./scripts/ci-server-check.sh --fast --env-file "$GITHUB_WORKSPACE/server/.env.ci-${GITHUB_RUN_ID}"

      - name: Run stage server gates
        if: github.event_name == 'workflow_dispatch'
        run: ./scripts/ci-server-check.sh --full --env-file "$GITHUB_WORKSPACE/server/.env.ci-${GITHUB_RUN_ID}"

      - name: Run lease-bound real MySQL 8.4 gate
        if: needs.changes.outputs.mysql == 'true'
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: ${{ job.services.mysql.ports[3306] }}
          DB_NAME: peanut_admin_ci_registered_mysql
          PEANUT_DATABASE_RESOURCE_ID: peanut-admin-ci-real-mysql84
          PEANUT_DATABASE_ENDPOINT_ID: peanut-admin-ci-real-mysql84-host
          PEANUT_DATABASE_CONSUMER: host
          PEANUT_DATABASE_ENVIRONMENT: continuous-integration
          PEANUT_DATABASE_RESOURCE_SCOPE: github-actions-job:${{ github.repository_id }}:${{ github.run_id }}:${{ github.run_attempt }}
          PEANUT_DATABASE_LEASE_ID: ci-mysql-${{ github.run_id }}-${{ github.run_attempt }}
          PEANUT_DATABASE_LEASE_OWNER: github-actions:${{ github.repository_id }}:${{ github.run_id }}:${{ github.run_attempt }}
          PEANUT_DATABASE_LEASE_GATE: real-mysql
          PEANUT_MYSQL_RESOURCE_MODE: --ci-service
        run: ./scripts/ci-server-check.sh --mysql --env-file "$GITHUB_WORKSPACE/server/.env.ci-mysql-${GITHUB_RUN_ID}"

      - name: Remove isolated backend environment
        if: always()
        shell: bash
        run: |
          backend_env="$GITHUB_WORKSPACE/server/.env.ci-${GITHUB_RUN_ID}"
          registered_mysql_env="$GITHUB_WORKSPACE/server/.env.ci-mysql-${GITHUB_RUN_ID}"
          [[ "$backend_env" == "$GITHUB_WORKSPACE"/server/.env.ci-* ]]
          [[ "$registered_mysql_env" == "$GITHUB_WORKSPACE"/server/.env.ci-mysql-* ]]
          rm -f -- "$backend_env" "$registered_mysql_env"

  web:
    name: Web
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: Install dependencies
        working-directory: web
        env:
          HUSKY: '0'
        run: pnpm install --frozen-lockfile
      - name: Check generated brand files
        run: node scripts/sync-brand-assets.mjs --check
      - name: Build
        working-directory: web
        run: pnpm run build
      - name: Test Web policies and form helpers
        working-directory: web
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import path from 'node:path'
          import { createServer } from 'vite'

          const server = await createServer({
            root: process.cwd(),
            configFile: false,
            logLevel: 'error',
            resolve: { alias: { '@': path.resolve(process.cwd(), 'src') } },
            optimizeDeps: { disabled: true },
            server: { middlewareMode: true },
            appType: 'custom',
          })
          try {
            for (const test of [
              'permission-policy.test.ts',
              'plugin-contribution.test.ts',
              'department-parent-options.test.ts',
            ]) {
              await server.ssrLoadModule(`/tests/Productization/${test}`)
            }
          } finally {
            await server.close()
          }
          NODE
          node tests/Productization/navbar-avatar-fallback.test.mjs

  platform:
    name: Platform
    needs: changes
    if: needs.changes.outputs.platform == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: platform/package-lock.json
      - name: Install dependencies
        working-directory: platform
        run: npm ci
      - name: Typecheck
        working-directory: platform
        run: npm run type:check
      - name: Build
        working-directory: platform
        run: npm run build

  pc:
    name: PC
    needs: changes
    if: needs.changes.outputs.pc == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: pc/package-lock.json
      - name: Install dependencies
        working-directory: pc
        run: npm ci
      - name: Typecheck
        working-directory: pc
        run: npm run typecheck
      - name: Build the server-rendered website
        working-directory: pc
        run: npm run build

  uniapp:
    name: UniApp
    needs: changes
    if: needs.changes.outputs.uniapp == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
          cache: npm
          cache-dependency-path: uniapp/package-lock.json
      - name: Install dependencies
        working-directory: uniapp
        run: npm ci
      - name: Typecheck
        working-directory: uniapp
        run: npm run type-check
      - name: Build H5
        working-directory: uniapp
        run: npm run build:h5
      - name: Build the supported WeChat client
        working-directory: uniapp
        run: npm run build:mp-weixin

name: Scaffold templates and qualified release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish only the already fully qualified exact main source and build bytes
        type: boolean
        default: false
      candidate_cli_commit:
        description: Exact independent peanut-cli source commit for the no-DB candidate contract
        type: string
        default: bc4a0732121a3494c1e206450dd8fe0027e24f09
      qualification_run_id:
        description: Successful same-repository Actions run holding native full transport (template-only runs are ineligible)
        type: string
      qualification_source_commit:
        description: Exact qualified source commit; main must retain its exact tree and normal integration proof
        type: string
      qualification_transport_sha256:
        description: Independently recorded SHA-256 of scaffold-full-qualification.tgz
        type: string
      main_integration_sha256:
        description: SHA-256 of the native premerge main integration receipt in that transport
        type: string
      qualification_ingress_asset_id:
        description: Import an existing same-repository GitHub Release asset ID containing the original full transport (no publication)
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: scaffold-template-${{ github.ref }}
  cancel-in-progress: false

jobs:
  templates:
    if: ${{ !inputs.publish && inputs.qualification_ingress_asset_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read the committed producer tool requirements
        id: requirements
        shell: bash
        run: |
          python3 scripts/project-env requirements > "$RUNNER_TEMP/producer-tools.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tools = json.loads((Path(os.environ['RUNNER_TEMP']) / 'producer-tools.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for name in ('php', 'node', 'pnpm', 'python3', 'composer'):
                  out.write(name + '=' + tools[name]['version'] + '\n')
          PY
      - name: Require a fixed independent CLI source
        env:
          CLI_COMMIT: ${{ inputs.candidate_cli_commit }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CLI_COMMIT" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@v4
        with:
          repository: peanut-business/peanut-cli
          ref: ${{ inputs.candidate_cli_commit }}
          path: .local/qualification-cli
          fetch-depth: 0
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.requirements.outputs.php }}
          extensions: json, mbstring, pdo_mysql, sodium, dom, fileinfo, curl, zip
          tools: composer:${{ steps.requirements.outputs.composer }}
          coverage: none
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.requirements.outputs.pnpm }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.requirements.outputs.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.requirements.outputs.python3 }}
      - name: Prepare the committed producer dependencies
        run: |
          composer --working-dir=server install --no-dev --no-plugins --no-scripts --no-interaction --no-progress --prefer-dist
          pnpm --dir web install --frozen-lockfile --ignore-scripts
      - name: Build both Editions with the local native contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test ! -e .peanut/application-manifest.json
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('release-versions.json','utf8')).scaffold_template")"
          for build in scaffold-templates scaffold-rebuild; do
            for edition in standalone multi-tenant; do
              php scripts/build-scaffold-release --version="$version" --source-commit="$GITHUB_SHA" \
                --edition="$edition" --workflow=runtime --output="$RUNNER_TEMP/$build/$edition"
            done
          done
          node scripts/release-template-artifacts.mjs compare "$RUNNER_TEMP/scaffold-templates" "$version" \
            "$GITHUB_SHA" "$(git rev-parse HEAD^{tree})" \
            "$(sha256sum scaffold/application-template-inventory.json | cut -d ' ' -f1)" \
            "$RUNNER_TEMP/scaffold-rebuild" > "$RUNNER_TEMP/rebuild-comparison.json"
      - name: Qualify the native candidate through the local entry
        shell: bash
        env:
          CLI_COMMIT: ${{ inputs.candidate_cli_commit }}
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          code = pathlib.Path.cwd()
          cli = code / ".local/qualification-cli"
          git = lambda root, *args: subprocess.check_output(["git", "-C", str(root), *args], text=True).strip()
          assert git(cli, "rev-parse", "HEAD") == os.environ["CLI_COMMIT"]
          value = {"protocol": "peanut.p0e-candidate-inputs.v1",
                   "source": {"commit": os.environ["GITHUB_SHA"], "tree": git(code, "rev-parse", "HEAD^{tree}")},
                   "cli": {"root": str(cli), "commit": os.environ["CLI_COMMIT"], "tree": git(cli, "rev-parse", "HEAD^{tree}")},
                   "template_build_root": os.environ["RUNNER_TEMP"] + "/scaffold-templates"}
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "candidate-inputs.json"
          assert not path.exists()
          path.write_text(json.dumps(value, indent=2) + "\n")
          PY
          python3 scripts/p0e-runtime-qualification candidate --candidate="$GITHUB_SHA" \
            --run-id="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --candidate-input="$RUNNER_TEMP/candidate-inputs.json" \
            --candidate-input-sha256="$(sha256sum "$RUNNER_TEMP/candidate-inputs.json" | cut -d ' ' -f1)" \
            --output-dir="$RUNNER_TEMP/template-qualification"
      - name: Preserve actual candidate inputs and stage outcome
        id: preserve_candidate
        if: ${{ always() }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # Preserve actual failure outputs too. No success status is manufactured.
          inputs=()
          for name in scaffold-templates scaffold-rebuild rebuild-comparison.json producer-tools.json template-qualification candidate-inputs.json; do
            if [[ -e "$RUNNER_TEMP/$name" || -L "$RUNNER_TEMP/$name" ]]; then
              inputs+=("$name")
            fi
          done
          if (( ${#inputs[@]} == 0 )); then
            echo "No candidate output was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          test ! -e "$RUNNER_TEMP/scaffold-template-qualification.tgz"
          # Tar retains hidden defaults, executable modes and any partial CLI target.
          tar -czf "$RUNNER_TEMP/scaffold-template-qualification.tgz" -C "$RUNNER_TEMP" -- "${inputs[@]}"
          cd "$RUNNER_TEMP"
          sha256sum scaffold-template-qualification.tgz > scaffold-template-qualification.tgz.sha256
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: scaffold-templates-${{ github.sha }}
          path: |
            ${{ runner.temp }}/scaffold-templates/standalone/peanut-scaffold-standalone.tgz
            ${{ runner.temp }}/scaffold-templates/standalone/peanut-scaffold-standalone.json
            ${{ runner.temp }}/scaffold-templates/standalone/scaffold-build-inputs.json
            ${{ runner.temp }}/scaffold-templates/multi-tenant/peanut-scaffold-multi-tenant.tgz
            ${{ runner.temp }}/scaffold-templates/multi-tenant/peanut-scaffold-multi-tenant.json
            ${{ runner.temp }}/scaffold-templates/multi-tenant/scaffold-build-inputs.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.preserve_candidate.outputs.available == 'true' }}
        with:
          name: scaffold-template-qualification-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/scaffold-template-qualification.tgz
            ${{ runner.temp }}/scaffold-template-qualification.tgz.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Report the remaining full qualification admission
        shell: bash
        run: |
          echo 'Full eight-group qualification: NOT_RUN. This job checks fixed templates and independent CLI creation only.' >> "$GITHUB_STEP_SUMMARY"
          echo 'The admitted lifecycle owner must seal its completed eight-group native result with scripts/p0e-runtime-qualification transport. Once an authorized existing same-repository Release asset holds those original bytes, select qualification_ingress_asset_id and the independent source/hashes to verify and preserve them through this workflow ingress. This template-only run cannot supply qualification_run_id for publication.' >> "$GITHUB_STEP_SUMMARY"

  ingress:
    if: ${{ !inputs.publish && inputs.qualification_ingress_asset_id != '' && github.repository == 'peanut-business/peanut-admin-code' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate the existing repository asset and fixed qualification inputs
        uses: actions/github-script@v7
        env:
          ASSET_ID: ${{ inputs.qualification_ingress_asset_id }}
          QUALIFICATION_SOURCE: ${{ inputs.qualification_source_commit }}
          TRANSPORT_SHA256: ${{ inputs.qualification_transport_sha256 }}
          INTEGRATION_SHA256: ${{ inputs.main_integration_sha256 }}
        with:
          script: |
            const id = process.env.ASSET_ID;
            if (!/^[1-9][0-9]*$/.test(id) || !Number.isSafeInteger(Number(id))
              || !/^[a-f0-9]{40}$/.test(process.env.QUALIFICATION_SOURCE)
              || process.env.QUALIFICATION_SOURCE !== context.sha
              || !/^[a-f0-9]{64}$/.test(process.env.TRANSPORT_SHA256)
              || !/^[a-f0-9]{64}$/.test(process.env.INTEGRATION_SHA256)) throw new Error('Exact independently recorded source and hashes required');
            const {data: asset} = await github.rest.repos.getReleaseAsset({...context.repo, asset_id: Number(id)});
            const url = `https://api.github.com/repos/peanut-business/peanut-admin-code/releases/assets/${id}`;
            if (asset.id !== Number(id) || asset.url !== url || asset.name !== 'scaffold-full-qualification.tgz'
              || asset.state !== 'uploaded' || !Number.isSafeInteger(asset.size) || asset.size <= 0
              || asset.size > 512 * 1024 * 1024 || asset.digest !== `sha256:${process.env.TRANSPORT_SHA256}`) throw new Error('Existing repository asset identity or digest differs');
      - name: Download original bytes only through the fixed repository API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_ID: ${{ inputs.qualification_ingress_asset_id }}
        run: |
          set -Eeuo pipefail
          [[ "$ASSET_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir "$RUNNER_TEMP/qualified-transfer"
          gh api "repos/peanut-business/peanut-admin-code/releases/assets/$ASSET_ID" \
            --header 'Accept: application/octet-stream' | python3 -c '
          import sys
          total = 0
          while block := sys.stdin.buffer.read(1024 * 1024):
              total += len(block)
              if total > 512 * 1024 * 1024: raise ValueError("Transport exceeds admission limit")
              sys.stdout.buffer.write(block)
          ' > "$RUNNER_TEMP/qualified-transfer/scaffold-full-qualification.tgz"
      - name: Read the committed verifier tool requirements
        id: requirements
        shell: bash
        run: |
          python3 scripts/project-env requirements > "$RUNNER_TEMP/producer-tools.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tools = json.loads((Path(os.environ['RUNNER_TEMP']) / 'producer-tools.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for name in ('php', 'node', 'pnpm', 'python3', 'composer'):
                  out.write(name + '=' + tools[name]['version'] + '\n')
          PY
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.requirements.outputs.php }}
          extensions: json, mbstring, pdo_mysql, sodium, dom, fileinfo, curl, zip
          tools: composer:${{ steps.requirements.outputs.composer }}
          coverage: none
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.requirements.outputs.pnpm }}
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.requirements.outputs.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.requirements.outputs.python3 }}
      - name: Prepare only the committed native verifier dependencies
        run: |
          composer --working-dir=server install --no-dev --no-plugins --no-scripts --no-interaction --no-progress --prefer-dist
          pnpm --dir web install --frozen-lockfile --ignore-scripts
      - name: Verify original full qualification and its final template bytes
        shell: bash
        env:
          TRANSPORT_SHA256: ${{ inputs.qualification_transport_sha256 }}
          INTEGRATION_SHA256: ${{ inputs.main_integration_sha256 }}
          QUALIFICATION_SOURCE: ${{ inputs.qualification_source_commit }}
        run: |
          set -Eeuo pipefail
          python3 scripts/verify-qualified-release-transport.py --mode=ingress \
            --archive="$RUNNER_TEMP/qualified-transfer/scaffold-full-qualification.tgz" \
            --transport-sha256="$TRANSPORT_SHA256" --main-integration-sha256="$INTEGRATION_SHA256" \
            --source-commit="$QUALIFICATION_SOURCE" --output-root="$RUNNER_TEMP/qualified-release"
      - uses: actions/upload-artifact@v4
        with:
          name: scaffold-full-qualification-${{ inputs.qualification_source_commit }}
          path: ${{ runner.temp }}/qualified-transfer/scaffold-full-qualification.tgz
          if-no-files-found: error
          retention-days: 7
      - name: Record admission scope
        run: |
          echo 'Original native full qualification transport verified and preserved. This run did not execute full8, create or upload a Release asset, publish, or deploy.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    if: ${{ inputs.publish && inputs.qualification_ingress_asset_id == '' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate the existing qualified transport run
        uses: actions/github-script@v7
        env:
          QUALIFICATION_RUN_ID: ${{ inputs.qualification_run_id }}
          QUALIFICATION_SOURCE: ${{ inputs.qualification_source_commit }}
          TRANSPORT_SHA256: ${{ inputs.qualification_transport_sha256 }}
          INTEGRATION_SHA256: ${{ inputs.main_integration_sha256 }}
        with:
          script: |
            const id = process.env.QUALIFICATION_RUN_ID;
            const source = process.env.QUALIFICATION_SOURCE;
            if (!/^[a-f0-9]{40}$/.test(source) || !/^[1-9][0-9]*$/.test(id) || !/^[a-f0-9]{64}$/.test(process.env.TRANSPORT_SHA256)
              || !/^[a-f0-9]{64}$/.test(process.env.INTEGRATION_SHA256)) throw new Error('Exact qualified transfer inputs required');
            const { data: run } = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: Number(id) });
            if (run.head_sha !== source || run.head_repository?.full_name !== context.payload.repository.full_name
              || run.status !== 'completed' || run.conclusion !== 'success'
              || run.event !== 'workflow_dispatch' || run.path !== '.github/workflows/scaffold-release.yml') throw new Error('Qualification run workflow, source, origin or completion differs');
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, { ...context.repo, run_id: Number(id), per_page: 100 });
            const found = artifacts.filter(a => a.name === `scaffold-full-qualification-${source}` && !a.expired);
            if (found.length !== 1) throw new Error('One complete full qualification transport is required');
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.qualification_run_id }}
          name: scaffold-full-qualification-${{ inputs.qualification_source_commit }}
          path: ${{ runner.temp }}/qualified-transfer
      - name: Read the committed verifier tool requirements
        id: requirements
        shell: bash
        run: |
          python3 scripts/project-env requirements > "$RUNNER_TEMP/producer-tools.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tools = json.loads((Path(os.environ['RUNNER_TEMP']) / 'producer-tools.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for name in ('php', 'node', 'pnpm', 'python3', 'composer'):
                  out.write(name + '=' + tools[name]['version'] + '\n')
          PY
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ steps.requirements.outputs.php }}
          extensions: json, mbstring, pdo_mysql, sodium, dom, fileinfo, curl, zip
          tools: composer:${{ steps.requirements.outputs.composer }}
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.requirements.outputs.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.requirements.outputs.python3 }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.requirements.outputs.pnpm }}
          run_install: false
      - name: Prepare only the committed verifier dependencies
        run: |
          composer --working-dir=server install --no-dev --no-plugins --no-scripts --no-interaction --no-progress --prefer-dist
          pnpm --dir web install --frozen-lockfile --ignore-scripts
      - name: Verify and unpack the original complete qualified bytes
        shell: bash
        env:
          TRANSPORT_SHA256: ${{ inputs.qualification_transport_sha256 }}
          INTEGRATION_SHA256: ${{ inputs.main_integration_sha256 }}
          QUALIFICATION_SOURCE: ${{ inputs.qualification_source_commit }}
        run: |
          set -Eeuo pipefail
          python3 scripts/verify-qualified-release-transport.py --mode=publish \
            --archive="$RUNNER_TEMP/qualified-transfer/scaffold-full-qualification.tgz" \
            --transport-sha256="$TRANSPORT_SHA256" --main-integration-sha256="$INTEGRATION_SHA256" \
            --source-commit="$QUALIFICATION_SOURCE" --output-root="$RUNNER_TEMP/qualified-release"
      - name: Publish the existing qualified native roots through the sole publisher
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('release-versions.json','utf8')).scaffold_template")"
          publisher=(scripts/publish-github-release "$version")
          # The publisher validates the exact semver and keeps prereleases off latest.
          if [[ "${version%%+*}" == *-* ]]; then publisher+=(--prerelease); fi
          "${publisher[@]}" \
            --qualification "$RUNNER_TEMP/qualified-release/qualification/summary.json" \
            --template-artifacts "$RUNNER_TEMP/qualified-release/scaffold-templates" \
            --main-integration="$RUNNER_TEMP/qualified-release/qualification/main-integration.json" \
            --output "$RUNNER_TEMP/published-release"

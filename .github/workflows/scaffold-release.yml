name: Scaffold templates and release
# Code Tag creation only records immutable source; explicit main dispatch consumes
# the once-qualified original artifact after protected PR merge.
on:
  workflow_dispatch:
    inputs:
      run_tests:
        description: Require full CI before production; publication only verifies the completed result
        type: boolean
        default: false
      pack_only:
        description: Build templates only; no CLI candidate creation or publication
        type: boolean
        default: false
      workflow:
        description: Explicit Workflow projection for both Edition templates
        type: choice
        options:
          - none
          - runtime
          - full
        default: runtime
      expected_source_commit:
        description: Exact dispatch HEAD required for template production
        type: string
        default: ''
      publish:
        description: Publish the exact CI-produced templates after protected dev-to-main integration
        type: boolean
        default: false
      candidate_cli_commit:
        description: Exact independent peanut-cli source commit for the no-DB candidate contract
        type: string
        default: c47ceecf539e817cf023177bb2bcba5f0f16d4a6
      build_run_id:
        description: Successful same-repository candidate run with both Edition templates and native CLI creation
        type: string
      source_commit:
        description: Exact candidate source with its same-tree dev-to-main merge retained in current main
        type: string
      build_transport_sha256:
        description: Independently recorded SHA-256 of the candidate run's scaffold-template-qualification.tgz
        type: string
      ci_run_id:
        description: Optional successful full-validation CI run for the exact candidate source
        type: string

permissions:
  contents: read

concurrency:
  group: scaffold-template-${{ github.ref }}
  cancel-in-progress: false

jobs:
  full-tests:
    name: Full CI
    permissions:
      contents: read
      actions: read
    if: ${{ github.event_name == 'workflow_dispatch' && !inputs.publish && inputs.run_tests }}
    uses: ./.github/workflows/ci.yml
    with:
      validation_scope: full
      expected_source_commit: ${{ inputs.expected_source_commit }}

  templates:
    needs: full-tests
    if: ${{ !cancelled() && ((github.event_name == 'push' && !github.event.deleted && github.repository == 'peanut-business/peanut-admin-code' && startsWith(github.ref, 'refs/tags/')) || (github.event_name == 'workflow_dispatch' && !inputs.publish)) && (needs.full-tests.result == 'success' || (!inputs.run_tests && needs.full-tests.result == 'skipped')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      source: ${{ github.sha }}
      run_id: ${{ github.run_id }}
      run_attempt: ${{ github.run_attempt }}
      transport_sha256: ${{ steps.preserve_candidate.outputs.sha256 }}
      artifact_id: ${{ steps.qualification_artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require the exact production source
        uses: actions/github-script@v7
        env:
          EXPECTED_SOURCE: ${{ inputs.expected_source_commit }}
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              if (!/^[a-f0-9]{40}$/.test(process.env.EXPECTED_SOURCE) || process.env.EXPECTED_SOURCE !== context.sha) {
                throw new Error('Exact dispatch source must match the production HEAD');
              }
            } else {
              const tag = context.ref.replace(/^refs\/tags\//, '');
              if (!/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-rc\.(0|[1-9][0-9]*))?$/.test(tag)) {
                throw new Error('Automatic publication requires a stable vX.Y.Z or vX.Y.Z-rc.N tag');
              }
              const {data: ref} = await github.rest.git.getRef({...context.repo, ref: `tags/${tag}`});
              if (ref.object.type !== 'tag') throw new Error('Publication requires an annotated tag');
              const {data: annotated} = await github.rest.git.getTag({...context.repo, tag_sha: ref.object.sha});
              const {data: main} = await github.rest.git.getRef({...context.repo, ref: 'heads/main'});
              if (annotated.tag !== tag || annotated.object.type !== 'commit'
                || annotated.object.sha !== context.sha || main.object.sha !== context.sha) {
                throw new Error('Tag source must be the current main commit');
              }
              const readSourceJson = async path => {
                const {data} = await github.rest.repos.getContent({...context.repo, path, ref: context.sha});
                if (data.type !== 'file' || data.encoding !== 'base64') throw new Error(`Unreadable source metadata: ${path}`);
                return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'));
              };
              const metadata = await readSourceJson('RELEASE_METADATA.json');
              const versions = await readSourceJson('release-versions.json');
              const version = tag.slice(1);
              if (metadata.expected_tag !== tag || metadata.source_product_version !== version
                || versions.scaffold_template !== version || versions.source_product_version !== version) {
                throw new Error('Tag version differs from the exact source release metadata or scaffold version');
              }
            }
      - name: Read the committed producer tool requirements
        id: requirements
        shell: bash
        run: |
          python3 scripts/project-env requirements > "$RUNNER_TEMP/producer-tools.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tools = json.loads((Path(os.environ['RUNNER_TEMP']) / 'producer-tools.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for name in ('php', 'node', 'pnpm', 'python3', 'composer'):
                  out.write(name + '=' + tools[name]['version'] + '\n')
          PY
      - name: Require a fixed independent CLI source
        if: ${{ !inputs.pack_only }}
        env:
          CLI_COMMIT: ${{ inputs.candidate_cli_commit || 'c47ceecf539e817cf023177bb2bcba5f0f16d4a6' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          [[ "$CLI_COMMIT" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@v4
        if: ${{ !inputs.pack_only }}
        with:
          repository: peanut-business/peanut-cli
          ref: ${{ inputs.candidate_cli_commit || 'c47ceecf539e817cf023177bb2bcba5f0f16d4a6' }}
          path: .local/qualification-cli
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare the fixed official producer tool image
        run: |
          scripts/ci-producer prepare "$RUNNER_TEMP/ci-producer"
          cp "$RUNNER_TEMP/ci-producer/identity.json" "$RUNNER_TEMP/producer-tools-actual.json"
      - name: Prepare the committed producer dependencies
        run: |
          scripts/ci-producer exec "$RUNNER_TEMP/ci-producer" -- bash -Eeuo pipefail <<'PRODUCER'
          composer --working-dir=server install --no-dev --no-plugins --no-scripts --no-interaction --no-progress --prefer-dist
          pnpm --dir web install --frozen-lockfile --ignore-scripts --package-import-method=copy
          npm --prefix uniapp ci --ignore-scripts
          PRODUCER
      - name: Build both Editions with the local native contract
        shell: bash
        env:
          WORKFLOW: ${{ inputs.workflow || 'runtime' }}
        run: |
          scripts/ci-producer exec "$RUNNER_TEMP/ci-producer" -- bash -Eeuo pipefail -s -- "$WORKFLOW" <<'PRODUCER'
          set -Eeuo pipefail
          workflow="$1"
          test ! -e .peanut/application-manifest.json
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('release-versions.json','utf8')).scaffold_template")"
          for edition in standalone multi-tenant; do
            php scripts/build-scaffold-release --version="$version" --source-commit="$GITHUB_SHA" \
              --edition="$edition" --workflow="$workflow" --output="$RUNNER_TEMP/scaffold-templates/$edition"
          done
          PRODUCER
      - name: Qualify the native candidate through the local entry
        if: ${{ !inputs.pack_only }}
        shell: bash
        env:
          CLI_COMMIT: ${{ inputs.candidate_cli_commit || 'c47ceecf539e817cf023177bb2bcba5f0f16d4a6' }}
          RUN_TESTS: ${{ inputs.run_tests && 'true' || 'false' }}
        run: |
          scripts/ci-producer exec "$RUNNER_TEMP/ci-producer" -- bash -Eeuo pipefail -s -- "$RUN_TESTS" <<'PRODUCER'
          set -Eeuo pipefail
          export RUN_TESTS="$1"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          code = pathlib.Path.cwd()
          cli = code / ".local/qualification-cli"
          git = lambda root, *args: subprocess.check_output(["git", "-C", str(root), *args], text=True).strip()
          assert git(cli, "rev-parse", "HEAD") == os.environ["CLI_COMMIT"]
          value = {"protocol": "peanut.p0e-candidate-inputs.v1",
                   "source": {"commit": os.environ["GITHUB_SHA"], "tree": git(code, "rev-parse", "HEAD^{tree}")},
                   "cli": {"root": str(cli), "commit": os.environ["CLI_COMMIT"], "tree": git(cli, "rev-parse", "HEAD^{tree}")},
                   "template_build_root": os.environ["RUNNER_TEMP"] + "/scaffold-templates",
                   "run_tests": os.environ["RUN_TESTS"] == "true"}
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "candidate-inputs.json"
          assert not path.exists()
          path.write_text(json.dumps(value, indent=2) + "\n")
          PY
          python3 scripts/p0e-runtime-qualification candidate --candidate="$GITHUB_SHA" \
            --run-id="ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --candidate-input="$RUNNER_TEMP/candidate-inputs.json" \
            --candidate-input-sha256="$(sha256sum "$RUNNER_TEMP/candidate-inputs.json" | cut -d ' ' -f1)" \
            --output-dir="$RUNNER_TEMP/template-qualification"
          PRODUCER
      - name: Preserve actual producer inputs and stage outcome
        id: preserve_candidate
        if: ${{ always() }}
        env:
          PACK_ONLY: ${{ inputs.pack_only }}
        shell: bash
        run: |
          set -Eeuo pipefail
          # Preserve actual failure outputs too. No success status is manufactured.
          inputs=()
          for name in scaffold-templates producer-tools.json producer-tools-actual.json template-qualification candidate-inputs.json; do
            if [[ -e "$RUNNER_TEMP/$name" || -L "$RUNNER_TEMP/$name" ]]; then
              inputs+=("$name")
            fi
          done
          if (( ${#inputs[@]} == 0 )); then
            echo "No candidate output was produced." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          transport_name=scaffold-template-qualification
          if [[ "$PACK_ONLY" == true ]]; then transport_name=scaffold-template-identity; fi
          test ! -e "$RUNNER_TEMP/$transport_name.tgz"
          # Tar retains hidden defaults, executable modes and any partial CLI target.
          tar -czf "$RUNNER_TEMP/$transport_name.tgz" -C "$RUNNER_TEMP" -- "${inputs[@]}"
          cd "$RUNNER_TEMP"
          sha256sum "$transport_name.tgz" | tee "$transport_name.tgz.sha256"
          echo "sha256=$(cut -d ' ' -f1 "$transport_name.tgz.sha256")" >> "$GITHUB_OUTPUT"
          echo "transport_path=$RUNNER_TEMP/$transport_name.tgz" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.pack_only && 'scaffold-identity-packages' || 'scaffold-templates' }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/scaffold-templates/standalone/peanut-scaffold-standalone.tgz
            ${{ runner.temp }}/scaffold-templates/standalone/peanut-scaffold-standalone.json
            ${{ runner.temp }}/scaffold-templates/standalone/scaffold-build-inputs.json
            ${{ runner.temp }}/scaffold-templates/multi-tenant/peanut-scaffold-multi-tenant.tgz
            ${{ runner.temp }}/scaffold-templates/multi-tenant/peanut-scaffold-multi-tenant.json
            ${{ runner.temp }}/scaffold-templates/multi-tenant/scaffold-build-inputs.json
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.preserve_candidate.outputs.available == 'true' }}
        id: qualification_artifact
        with:
          name: ${{ inputs.pack_only && 'scaffold-template-identity' || 'scaffold-template-qualification' }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.preserve_candidate.outputs.transport_path }}
            ${{ steps.preserve_candidate.outputs.transport_path }}.sha256
          if-no-files-found: error
          retention-days: 7
      - name: Record the actual release scope
        env:
          RUN_TESTS: ${{ inputs.run_tests && 'true' || 'false' }}
        shell: bash
        run: |
          echo 'CI produces the formal Edition archives once and checks artifact integrity and native CLI creation.' >> "$GITHUB_STEP_SUMMARY"
          if [[ "$RUN_TESTS" == true ]]; then
            echo 'Full application CI: PASS, required by run_tests=true and completed through the existing ci.yml before production.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Full application CI: NOT_RUN by this production run (run_tests=false).' >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'The qualification transport contains these same archives and receipts; it is not a second template build.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Public latest consumption, ST/MT installation, startup, IAB login and basic business are checked against the published release; no pre-publication result claims they passed.' >> "$GITHUB_STEP_SUMMARY"


  publish:
    needs: templates
    if: ${{ !cancelled() && github.repository == 'peanut-business/peanut-admin-code' && ((github.event_name == 'push' && !github.event.deleted && startsWith(github.ref, 'refs/tags/') && needs.templates.result == 'success') || (github.event_name == 'workflow_dispatch' && !inputs.pack_only && inputs.publish && github.ref == 'refs/heads/main')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Authenticate the original CI build and enforce the selected test requirement
        id: candidate
        uses: actions/github-script@v7
        env:
          BUILD_RUN: ${{ github.event_name == 'push' && needs.templates.outputs.run_id || inputs.build_run_id }}
          CI_RUN: ${{ inputs.ci_run_id }}
          RUN_TESTS: ${{ inputs.run_tests && 'true' || 'false' }}
          SOURCE: ${{ github.event_name == 'push' && needs.templates.outputs.source || inputs.source_commit }}
          TRANSPORT_SHA256: ${{ github.event_name == 'push' && needs.templates.outputs.transport_sha256 || inputs.build_transport_sha256 }}
          PRODUCER_RESULT: ${{ needs.templates.result }}
          PRODUCER_ATTEMPT: ${{ needs.templates.outputs.run_attempt }}
          PRODUCER_ARTIFACT_ID: ${{ needs.templates.outputs.artifact_id }}
        with:
          script: |
            const source = process.env.SOURCE;
            const buildId = process.env.BUILD_RUN;
            let ciId = process.env.CI_RUN;
            if (!/^[a-f0-9]{40}$/.test(source) || !/^[1-9][0-9]*$/.test(buildId)
              || (ciId && !/^[1-9][0-9]*$/.test(ciId)) || !/^[a-f0-9]{64}$/.test(process.env.TRANSPORT_SHA256)) {
              throw new Error('Exact source, successful production run and original transport SHA-256 are required; a supplied validation run must be valid');
            }
            const fetchRun = async (id, path) => {
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(id)});
              if (run.head_sha !== source || run.head_repository?.full_name !== context.payload.repository.full_name
                || run.status !== 'completed' || run.conclusion !== 'success' || run.event !== 'workflow_dispatch'
                || run.path !== path) throw new Error('Run source, origin, workflow or actual result differs');
              return run;
            };
            const sameRun = context.eventName === 'push';
            let build;
            if (sameRun) {
              const {data: run} = await github.rest.actions.getWorkflowRun({...context.repo, run_id: Number(buildId)});
              if (String(buildId) !== String(context.runId) || run.id !== context.runId
                || run.head_sha !== source || source !== context.sha || run.event !== 'push'
                || run.head_repository?.full_name !== context.payload.repository.full_name
                || run.path !== '.github/workflows/scaffold-release.yml'
                || run.run_attempt !== Number(process.env.PRODUCER_ATTEMPT)
                || run.run_attempt !== Number(process.env.GITHUB_RUN_ATTEMPT)
                || process.env.PRODUCER_RESULT !== 'success') {
                throw new Error('Tag publication requires this run and attempt of the successful producer');
              }
              build = run;
            } else {
              build = await fetchRun(buildId, '.github/workflows/scaffold-release.yml');
            }
            const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt,
              {...context.repo, run_id: Number(buildId), attempt_number: build.run_attempt, per_page: 100});
            const producers = jobs.filter(job => job.name === 'templates');
            if (producers.length !== 1 || producers[0].run_id !== Number(buildId)
              || producers[0].head_sha !== source || producers[0].status !== 'completed'
              || producers[0].conclusion !== 'success') {
              throw new Error('One completed successful templates job for the exact production attempt is required');
            }
            const summary = jobs.filter(job => job.name === 'Full CI / CI summary')
              .sort((a, b) => b.id - a.id)[0];
            if (summary && (summary.status !== 'completed' || summary.conclusion !== 'success')) {
              throw new Error('The selected candidate has no successful latest full CI summary');
            }
            const embeddedCi = Boolean(summary);
            const verifyFullJobs = (selectedJobs, run, prefix) => {
              for (const name of ['Stale facts', 'Changed paths', 'Create app', 'PHP 8.3', 'Integration / MySQL 8.4',
                'Web', 'Platform', 'PC', 'UniApp', 'Public docs', 'CI summary']) {
                const rows = selectedJobs.filter(job => job.name === prefix + name);
                if (rows.length !== 1 || rows[0].status !== 'completed' || rows[0].conclusion !== 'success'
                  || rows[0].head_sha !== source || rows[0].run_id !== run.id) {
                  throw new Error('A partial/reused CI summary is not a completed full CI qualification: ' + name);
                }
              }
            };
            if (embeddedCi) verifyFullJobs(jobs, build, 'Full CI / ');
            if (sameRun && (ciId || embeddedCi || process.env.RUN_TESTS !== 'false')) {
              throw new Error('An in-progress tag run cannot serve as completed full CI');
            }
            if (ciId && ciId !== buildId) {
              const selectedCi = await fetchRun(ciId, '.github/workflows/ci.yml');
              const ciJobs = await github.paginate(github.rest.actions.listJobsForWorkflowRunAttempt,
                {...context.repo, run_id: Number(ciId), attempt_number: selectedCi.run_attempt, per_page: 100});
              verifyFullJobs(ciJobs, selectedCi, '');
            }
            if (ciId === buildId && !embeddedCi) throw new Error('Production run does not contain successful full CI');
            if (!ciId && embeddedCi) ciId = buildId;
            if (process.env.RUN_TESTS === 'true' && !ciId) {
              throw new Error('run_tests=true requires successful exact-source full CI in the production run or ci_run_id');
            }
            core.setOutput('ci_run', ciId);
            core.setOutput('run_tests', process.env.RUN_TESTS === 'true' || embeddedCi ? 'true' : 'false');
            core.setOutput('build_run', buildId);
            core.setOutput('source', source);
            core.setOutput('transport_sha256', process.env.TRANSPORT_SHA256);
            const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts,
              {...context.repo, run_id: Number(buildId), per_page: 100});
            const expected = `scaffold-template-qualification-${source}-${buildId}-${build.run_attempt}`;
            const found = artifacts.filter(a => a.name === expected && !a.expired);
            if (found.length !== 1) throw new Error('One original successful native candidate artifact is required');
            if (sameRun && String(found[0].id) !== process.env.PRODUCER_ARTIFACT_ID) {
              throw new Error('Artifact differs from this successful templates job output');
            }
            core.setOutput('artifact', found[0].name);
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.candidate.outputs.build_run }}
          name: ${{ steps.candidate.outputs.artifact }}
          path: ${{ runner.temp }}/candidate-transfer
      - name: Read the committed verifier requirements
        id: requirements
        run: |
          python3 scripts/project-env requirements > "$RUNNER_TEMP/producer-tools.json"
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          tools = json.loads((Path(os.environ['RUNNER_TEMP']) / 'producer-tools.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              for name in ('node', 'pnpm', 'python3'):
                  out.write(name + '=' + tools[name]['version'] + '\n')
          PYTHON
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.requirements.outputs.node }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.requirements.outputs.python3 }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.requirements.outputs.pnpm }}
          run_install: false
      - name: Prepare the locked manifest parser
        run: pnpm --dir web install --frozen-lockfile --ignore-scripts --package-import-method=copy
      - name: Verify the original candidate and template bytes without rebuilding
        id: verified
        env:
          TRANSPORT_SHA256: ${{ steps.candidate.outputs.transport_sha256 }}
          SOURCE: ${{ steps.candidate.outputs.source }}
          CI_RUN: ${{ steps.candidate.outputs.ci_run }}
        run: |
          python3 scripts/verify-qualified-release-transport.py \
            --archive="$RUNNER_TEMP/candidate-transfer/scaffold-template-qualification.tgz" \
            --transport-sha256="$TRANSPORT_SHA256" --source-commit="$SOURCE" \
            --full-ci-run-id="$CI_RUN" --github-output="$GITHUB_OUTPUT" \
            --output-root="$RUNNER_TEMP/candidate-release"
      - name: Verify source-to-main PR and create or reuse only the exact annotated source tag
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ steps.candidate.outputs.source }}
        run: |
          set -Eeuo pipefail
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('release-versions.json','utf8')).scaffold_template")"
          python3 scripts/ensure-qualified-release-tag --version "$version" --source "$SOURCE" --create-in-publish-ci
      - name: Publish the verified native templates through the sole publisher
        env:
          GH_TOKEN: ${{ github.token }}
          TRANSPORT_SHA256: ${{ steps.candidate.outputs.transport_sha256 }}
          PEANUT_RELEASE_CANDIDATE_RUN_ID: ${{ steps.candidate.outputs.build_run }}
          PEANUT_RELEASE_CI_RUN_ID: ${{ steps.candidate.outputs.ci_run }}
          PEANUT_RELEASE_RUN_TESTS: ${{ steps.candidate.outputs.run_tests == 'true' || steps.verified.outputs.run_tests_required == 'true' }}
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          version="$(node -p "JSON.parse(require('node:fs').readFileSync('release-versions.json','utf8')).scaffold_template")"
          publisher=(scripts/publish-github-release "$version")
          if [[ "${version%%+*}" == *-* ]]; then publisher+=(--prerelease); fi
          "${publisher[@]}" \
            --qualification-transport-sha256="$TRANSPORT_SHA256" \
            --qualification "$RUNNER_TEMP/candidate-release/template-qualification/candidate-stage.json" \
            --template-artifacts "$RUNNER_TEMP/candidate-release/scaffold-templates" \
            --output "$RUNNER_TEMP/published-release"

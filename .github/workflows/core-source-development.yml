name: Core source development

on:
  pull_request:
    branches: [dev]
    paths:
      - scripts/core-dev
      - scripts/local-core-web
      - scripts/local-core-composer
      - scripts/tests/core-dev-contract-test.py
      - .github/workflows/core-source-development.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-source-development-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  source-link:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: code
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: peanut-business/peanut-admin-core-php
          ref: dev
          path: core-php
      - uses: actions/checkout@v4
        with:
          repository: peanut-business/peanut-admin-core-web
          ref: dev
          path: core-web
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2.10.2
          coverage: none
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.6
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - name: Check source selection contracts
        working-directory: code
        run: python3 scripts/tests/core-dev-contract-test.py
      - name: Record development source identities
        run: |
          for repo in code core-php core-web; do
            printf '%s ' "$repo"
            git -C "$repo" rev-parse HEAD HEAD^{tree}
          done
      - name: Prepare locked host dependencies
        working-directory: code
        env:
          HUSKY: '0'
        run: |
          ./scripts/project-composer prepare
          pnpm --dir web install --frozen-lockfile --ignore-scripts
          for client in platform pc uniapp; do npm --prefix "$client" ci --ignore-scripts; done
      - name: Activate and verify both local Core sources
        working-directory: code
        run: |
          umask 077
          env_file="$RUNNER_TEMP/peanut-core-source.env"
          printf '%s\n' 'APP_ENV=development' 'APP_DEBUG=false' 'DEPLOYMENT_MODE=multi-tenant' > "$env_file"
          trap 'rm -f -- "$env_file"' EXIT
          ./scripts/core-dev install --php-core-dir "$GITHUB_WORKSPACE/core-php" --web-core-dir "$GITHUB_WORKSPACE/core-web" --backend-env "$env_file"
          ./scripts/core-dev status --php-core-dir "$GITHUB_WORKSPACE/core-php" --web-core-dir "$GITHUB_WORKSPACE/core-web"
          git diff --exit-code -- server/composer.json server/composer.lock web/package.json web/pnpm-lock.yaml platform/package.json platform/package-lock.json pc/package.json pc/package-lock.json uniapp/package.json uniapp/package-lock.json
      - name: Save exact public source snapshot for mechanical follow-up
        if: always()
        run: git -C code archive --format=tar.gz --output="$RUNNER_TEMP/peanut-code-source.tar.gz" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-development-${{ github.run_id }}
          path: ${{ runner.temp }}/peanut-code-source.tar.gz
          retention-days: 3
          if-no-files-found: error
